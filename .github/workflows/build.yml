
name: Build ZAIN STORE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -type f -name "ZAIN_STORE_Android_Project_Supabase_Connected.zip" | head -n 1)
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd project/ZAIN_STORE_Android_Project/android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAIN-STORE-APK
          path: project/ZAIN_STORE_Android_Project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
