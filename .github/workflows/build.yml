
name: Build ZAIN STORE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -type f -name "ZAIN_STORE_Android_Project_Supabase_Connected.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP not found"
            exit 1
          fi
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Locate Android project
        run: |
          ANDROID_DIR=$(find project -type f -path "*/android/app/build.gradle" | head -n 1)
          if [ -z "$ANDROID_DIR" ]; then
            echo "Android build.gradle not found"
            find project -maxdepth 6 -type f
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$(dirname "$(dirname "$ANDROID_DIR")")" >> "$GITHUB_ENV"
          echo "Found Android project: $ANDROID_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$ANDROID_PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAIN-STORE-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
