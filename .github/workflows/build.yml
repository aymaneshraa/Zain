name: Build ZAIN STORE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o ZAIN_STORE_Android_Project_Supabase_Connected.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        run: |
    sudo apt-get update
    sudo apt-get install -y android-sdk
    echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
    echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd project/android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAIN-STORE-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
