
name: Build ZAIN STORE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        run: |
          echo "Searching for project ZIP..."
          find . -type f
          ZIP=$(find . -type f -name "ZAIN_STORE_Android_Project_Supabase_Connected.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP FILE NOT FOUND"
            exit 1
          fi

          echo "Found: $ZIP"
          mkdir -p project
          unzip -o "$ZIP" -d project

          echo "Project contents:"
          find project -maxdepth 4 -type f

          if [ ! -f project/android/app/build.gradle ]; then
            echo "ERROR: Android project not found in expected location"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd project/android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAIN-STORE-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
