
name: Build ZAIN STORE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -type f -name "ZAIN_STORE_Android_Project_Supabase_Connected.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Check Android SDK
        run: |
          echo "Android SDK location:"
          echo "$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          echo "SDK platforms:"
          ls -la "$ANDROID_HOME/platforms"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd project/ZAIN_STORE_Android_Project/android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAIN-STORE-APK
          path: project/ZAIN_STORE_Android_Project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
