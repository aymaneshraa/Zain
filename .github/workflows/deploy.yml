
name: Deploy ZAIN STORE Admin

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZAIN_STORE_Android_Project_Supabase_Connected.zip'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -type f -name "ZAIN_STORE_Android_Project_Supabase_Connected.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          - name: Show extracted files
       
          run: |
          echo "=== ZIP CONTENTS ==="
          find extracted -maxdepth 7 -type f

      - name: Prepare website
        run: |
          ADMIN_FILE=$(find extracted -type f -path "*/web/admin/index.html" | head -n 1)
          if [ -z "$ADMIN_FILE" ]; then
            echo "Admin page not found"
            exit 1
          fi
          WEB_DIR=$(dirname "$(dirname "$ADMIN_FILE")")
          mkdir public
          cp -R "$WEB_DIR"/. public/
          echo '<!doctype html><html lang="ar"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./admin/"><title>ZAIN STORE</title><a href="./admin/">فتح لوحة التحكم</a></html>' > public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
